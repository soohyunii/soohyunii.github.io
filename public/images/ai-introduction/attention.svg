<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><title>Attention: compare, weight, combine</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="960" height="500" rx="18" fill="#0f172a"/><text x="40" y="55" fill="#e2e8f0" font-size="28" font-family="Arial, sans-serif">Attention: compare, weight, combine</text><rect x="40" y="130" width="180" height="90" rx="18" fill="#1e3a5f"/><text x="68" y="182" fill="#e2e8f0" font-size="25" font-family="Arial, sans-serif">Query (Q)</text><rect x="40" y="280" width="180" height="90" rx="18" fill="#1e3a5f"/><text x="68" y="332" fill="#e2e8f0" font-size="25" font-family="Arial, sans-serif">Keys (K)</text><rect x="300" y="190" width="250" height="125" rx="18" fill="#155e75"/><text x="325" y="234" fill="#e2e8f0" font-size="22" font-family="Arial, sans-serif">Relevance scores</text><text x="325" y="277" fill="#e2e8f0" font-size="21" font-family="Arial, sans-serif">Scale + softmax</text><rect x="630" y="105" width="280" height="80" rx="18" fill="#1e293b"/><text x="660" y="156" fill="#e2e8f0" font-size="24" font-family="Arial, sans-serif">Values (V)</text><rect x="630" y="260" width="280" height="110" rx="18" fill="#0f766e"/><text x="659" y="306" fill="#e2e8f0" font-size="25" font-family="Arial, sans-serif">Weighted sum</text><text x="659" y="341" fill="#e2e8f0" font-size="18" font-family="Arial, sans-serif">Context representation</text><path d="M220 175 L300 217" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 325 L300 282" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 252 L630 300" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 185 L770 258" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><text x="566" y="234" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">weights</text><text x="40" y="437" fill="#e2e8f0" font-size="21" font-family="Arial, sans-serif">Attention combines values according to their relevance to the query.</text></svg>